# elevenlabs — voiceover, transcription, sound effects, music, voice search and the rest of the ElevenLabs API for agents.
# kind MUST stay "integration": outputs go into workspace artifacts with
# provenance and usage is recorded — in-process facilities a catalog "tool"
# plugin (out-of-process, flat schemas) does not have.
name: elevenlabs
title: ElevenLabs
version: 0.5.0
kind: integration
description: ElevenLabs for agents — voiceover in any voice, transcription with speakers and subtitles, sound effects, music, and the rest of the API (voice isolation, voice changer and cloning, dialogue, dubbing, stems). Outputs land in the task's artifacts.
entry: index.mjs
# the same ElevenLabs models through an aggregator (fal) are refused while this
# plugin is active — one account, one bill, provenance kept
direct_models:
  - fal-ai/elevenlabs/
  - elevenlabs/
requires_env:
  - ELEVENLABS_API_KEY   # its own key — the voice assistant's ELEVENLABS_PERSONA_KEY is separate
config_schema:
  type: object
  properties:
    api_key:
      type: string
      title: API key
      secret: true
      credential: ELEVENLABS_API_KEY
      placeholder: "${ELEVENLABS_API_KEY}"
      description: Leave empty to use the ElevenLabs key from Settings → Integrations
    default_model:
      type: string
      title: Default model
      default: eleven_v3
      description: Used when a call names none (see eleven_models). eleven_v3 plays audio tags; eleven_multilingual_v2 takes longer texts
    output_format:
      type: string
      title: Audio format
      enum: [mp3_44100_128, mp3_44100_192, pcm_44100, opus_48000_128]
      default: mp3_44100_128
